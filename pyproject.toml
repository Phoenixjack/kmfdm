[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmfdm"
version = "0.1.0"
description = "KiCad Management of Field-Defined Metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.5",
    "ruff>=0.16",
]

[project.scripts]
kmfdm = "kmfdm.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kmfdm = [
    "resources/*.ico",
    "resources/layouts/*.json",
    "resources/policies/*.json",
    "resources/ui-icons/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
