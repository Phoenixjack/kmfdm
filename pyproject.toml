[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmfdm"
version = "0.1.0"
description = "KiCad Management of Field-Defined Metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
kmfdm = "kmfdm.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kmfdm = ["resources/*.ico", "resources/layouts/*.json", "resources/policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
